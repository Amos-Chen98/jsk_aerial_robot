# Teleop Basic Param

navigation:
  xy_control_mode: 0
  # World Pos Control Mode: 0
  # World Vel Control Mode: 2
  # Local Vel Control Mode: 3
  # Attitude Control Mode: 4

  takeoff_height: 1.0
  outdoor_takeoff_height: 1.0

  joy_udp: false
  max_target_vel: 0.5
  joy_target_vel_interval: 0.005  # 0.2 / 20 = 0.01, 0.005 ~ 0.01  m/s
  joy_target_z_interval: 0.005
  max_target_yaw_rate: 0.1 #  0.05
  cmd_vel_lev2_gain : 2.0
  teleop_local_frame: fc

  gain_tunning_mode: 0
  nav_vel_limit: 0.2
  cmd_angle_lev2_gain : 1.5

  # gps waypoint
  gps_waypoint_threshold: 3.0
  gps_waypoint_check_du: 1.0

  # force landing
  force_landing_auto_stop_flag: false

  # desire tilt
  baselink_rot_pub_interval: 0.2
  baselink_rot_change_thresh: 0.04 # 0.2 sec (5 hz) -> 0.04; 0.1 sec (10 hz)-> 0.02; 0.05 sec (20 hz) -> 0.01
  root_target_deadzone: 0.10
  root_target_trigger_init_epsilon: 0.05
  joy_reconnect_reset_du: 1.0
  root_target_forward_gain: 0.45
  root_target_yaw_gain: 1.00
  root_target_pitch_gain: 0.35
  root_target_pitch_rate: 0.30
  root_target_forward_acc_limit: 0.25
  root_target_yaw_acc_limit: 1.00
  root_target_pitch_acc_limit: 0.50
